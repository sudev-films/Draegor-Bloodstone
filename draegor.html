<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lore | Draegor Bloodstone</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Eagle+Lake&family=Source+Serif+4:wght@800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/Draegor-Bloodstone/favicon.png">

    <style>
        /* 1. RESET & SHARED NAVBAR STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --nav-height: 80px;
            --gold: #FFD700;
        }

        body { 
            background-color: #0b0b0b; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', sans-serif; 
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Copy-pasted Navbar CSS from Index to ensure it looks the same */
        .navbar {
            height: var(--nav-height);
            background-color: #050505;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5% 0 0; 
            border-bottom: 1px solid #333;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-left { display: flex; align-items: center; height: 100%; gap: 20px; }
        .nav-logo { height: var(--nav-height); width: auto; display: block; object-fit: cover; }
        .studio-name { font-family: 'Eagle Lake', serif; color: var(--gold); font-size: 1.6rem; }
        .nav-right { display: flex; align-items: center; }
        .social-cluster { display: flex; gap: 15px; align-items: center; margin-right: 30px; padding-right: 20px; border-right: 1px solid #333; }
        .social-icon { width: 32px; transition: 0.2s; }
        .nav-txt { color: #e0e0e0; text-decoration: none; margin-left: 25px; font-size: 0.85rem; text-transform: uppercase; font-weight: 600; }

        /* 2. SCROLL-SCRUBBED VIDEO HERO STYLING */
        .scrub-container {
            margin-top: var(--nav-height);
            height: 500vh; /* Adjust track height to control scrubbing speed */
            position: relative;
            background: #000;
        }

        .scrub-sticky-frame {
            position: sticky;
            top: var(--nav-height);
            width: 100%;
            height: calc(100vh - var(--nav-height));
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        #introScrubVideo {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Zooms in slightly to fill every pixel */
            background: #000;
        }

        /* 3. DRAEGOR PAGE CONTENT STYLING */
        .lore-container {
            padding: 100px 10%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        h1.lore-title {
            font-family: 'Source Serif 4', serif;
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    {% include navbar.html %}

    <!-- Interactive Scroll-Scrub Section -->
    <section class="scrub-container">
        <div class="scrub-sticky-frame">
            <video id="introScrubVideo" playsinline preload="auto" muted>
    <source src="/Draegor-Bloodstone/draegor-intro.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <!-- Lore Content (Unlocks once scrolling passes the video) -->
    <main class="lore-container">
        <h1 class="lore-title">The Chronicles</h1>
        <h2>Chapter I: The Intersection</h2>
        <p>Your epic lore about Norse, Greek, and Hindu mythologies starts here...</p>
    </main>

    <footer>
        <center style="padding: 50px; color: #555;">&copy; 2026 VEDIC ASURA STUDIOS</center>
    </footer>

    <!-- GSAP & ScrollTrigger CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

const introVid = document.getElementById("introScrubVideo");

function initScrub() {
    // Force first frame render
    introVid.currentTime = 0.001;

    // Virtual proxy object to hold the target time
    const videoProxy = { currentTime: 0 };

    // GSAP tween that provides continuous deceleration
    const scrubTween = gsap.to(videoProxy, {
        currentTime: introVid.duration,
        ease: "none",
        scrollTrigger: {
            trigger: ".scrub-container",
            start: "top top+=" + getComputedStyle(document.documentElement).getPropertyValue('--nav-height'),
            end: "bottom bottom",
            scrub: 1.2, // Adds cinematic inertia damping (try 0.8 to 1.5)
        },
        onUpdate: () => {
            // Only update when time actually changes
            if (Math.abs(introVid.currentTime - videoProxy.currentTime) > 0.01) {
                introVid.currentTime = videoProxy.currentTime;
            }
        }
    });
}

if (introVid.readyState >= 1) {
    initScrub();
} else {
    introVid.addEventListener("loadedmetadata", initScrub);
    introVid.load();
}
    </script>
</body>
</html>
